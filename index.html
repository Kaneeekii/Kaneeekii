<!doctype html>
<!-- Kaneee League - par Kaneeekii Développeur -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaneee League</title>
    <!-- Favicon original (un ballon rouge) en SVG inline : évite une requête 404 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e01b1b'/%3E%3Cpath d='M16 6l5 4-2 6h-6l-2-6z' fill='%231a0000'/%3E%3C/svg%3E"
    />
    <style>
      /* Le canvas 3D prend tout l'écran, l'interface HTML est posée par-dessus. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0b10;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #ffffff;
      }

      #game {
        position: fixed;
        inset: 0;
      }

      #game canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* HUD : infos de debug utiles pour régler la conduite */
      #hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        font-size: 14px;
        line-height: 1.5;
        pointer-events: none;
        user-select: none;
      }

      #hud .speed {
        font-size: 28px;
        font-weight: 700;
        color: #e01b1b;
      }

      #hud kbd {
        display: inline-block;
        padding: 0 5px;
        border: 1px solid #666;
        border-radius: 4px;
        background: #222;
        font-size: 12px;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        background: #0b0b10;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <div id="hud">
      <div><span class="speed" id="hud-speed">0</span> km/h</div>
      <div>
        <kbd>Z</kbd> / <kbd>↑</kbd> accélérer &nbsp;
        <kbd>S</kbd> / <kbd>↓</kbd> freiner / reculer &nbsp;
        <kbd>Q</kbd> <kbd>D</kbd> / <kbd>←</kbd> <kbd>→</kbd> tourner
      </div>
    </div>

    <div id="loading">Chargement du moteur physique…</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
